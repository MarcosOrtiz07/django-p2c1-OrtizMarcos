{% load django_bootstrap5 %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECOENERGY</title>
    {% bootstrap_css %}
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-danger mb-4 shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold text-white" href="{% url 'inicio' %}">ECOENERGY</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link text-white" href="{% url 'inicio' %}">Inicio</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white" href="{% url 'zonas_list' %}">Zonas</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white" href="{% url 'dispositivos_list' %}">Dispositivos</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<main class="container">
    {% block content %}
    {% endblock %}
</main>

{% bootstrap_javascript %}
</body>
</html>
